name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  KUSTOMIZE_VERSION: "5.8.2"
  KUBECONFORM_VERSION: "0.8.0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest
      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit -r requirements.txt

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize and kubeconform
        run: |
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin kustomize
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar xz -C /usr/local/bin kubeconform
      - name: Validate overlays against the Kubernetes schema
        run: |
          for env in dev prod; do
            kustomize build deploy/overlays/$env | kubeconform -strict -summary -kubernetes-version 1.31.0
          done
      - name: Validate Argo CD resources
        run: |
          kubeconform -strict -summary -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' argocd/
      - name: Security policy (checkov)
        run: |
          pip install checkov
          kustomize build deploy/overlays/prod > rendered.yaml
          checkov -f rendered.yaml --framework kubernetes --config-file .checkov.yaml --quiet --compact
          checkov -f Dockerfile --framework dockerfile --config-file .checkov.yaml --quiet --compact

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build (load locally for scanning)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          format: spdx-json
          artifact-name: sbom.spdx.json
      - name: Push and sign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG")" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@v4.1.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Sign by digest (keyless, Sigstore)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes "$DIGEST"

  # Deploy the dev overlay into a throwaway kind cluster and prove the pods
  # pass the "restricted" Pod Security Standard, become ready and serve.
  e2e:
    needs: [test, manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1.15.0
        with:
          cluster_name: ci
      - name: Build image into the cluster
        run: |
          docker build -t k8s-gitops-app:e2e --build-arg APP_VERSION=e2e .
          kind load docker-image k8s-gitops-app:e2e --name ci
      - name: Install kustomize
        run: curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin kustomize
      - name: Deploy dev overlay with the local image
        run: |
          cd deploy/overlays/dev
          kustomize edit set image ghcr.io/brianmahlatini/k8s-gitops-app=k8s-gitops-app:e2e
          kustomize build . | kubectl apply -f -
          kubectl -n app-dev rollout status deploy/app --timeout=120s
      - name: Smoke test
        run: |
          kubectl -n app-dev port-forward svc/app 8080:80 &
          for _ in $(seq 1 20); do curl -fsS localhost:8080/readyz && break; sleep 1; done
          curl -fsS localhost:8080/api/items | tee /dev/stderr | grep -q "Sample widget"
          curl -fsS localhost:8080/api/info | grep -q '"env":"dev"'
          curl -fsS localhost:8080/metrics | grep -q http_requests_total
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all,events -n app-dev
          kubectl -n app-dev describe pods
          kubectl -n app-dev logs deploy/app --tail=100 || true

  # GitOps: record the new image in Git; Argo CD deploys dev from there.
  bump-dev:
    needs: [image, e2e, manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize
        run: curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin kustomize
      - name: Update dev image tag
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          cd deploy/overlays/dev
          kustomize edit set image "ghcr.io/brianmahlatini/k8s-gitops-app=ghcr.io/brianmahlatini/k8s-gitops-app:${TAG}"
          cd -
          if git diff --quiet; then echo "already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(dev): ${TAG}"
          git push   # pushes made with GITHUB_TOKEN do not re-trigger workflows
